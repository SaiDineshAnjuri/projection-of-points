<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projection of a point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2327;--paper:#F6F8F7;--desk:#DEE4E2;--vp:#2C5E8F;--hp:#2F8363;--pt:#D2402F;--muted:#55616A}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
h1{margin:0;font-size:22px;font-weight:600}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stage{position:sticky;top:0;z-index:5;background:var(--desk);padding:0 10px 10px}
.sheet{background:var(--paper);border:1.5px solid var(--ink)}
canvas{display:block;width:100%;height:clamp(240px,40vh,380px)}
.tb{display:grid;grid-template-columns:78px 1fr;border-top:1.5px solid var(--ink)}
.tb b{padding:8px;border-right:1px solid var(--ink);font-size:13px;font-weight:600;color:var(--muted)}
.tb p{margin:0;padding:8px 10px;font-size:14px;line-height:1.35;min-height:4.3em}
.controls{margin:0 10px;background:var(--paper);border:1.5px solid var(--ink)}
.group{padding:12px 14px}
.group+.group{border-top:1px solid rgba(30,35,39,.2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h2{margin:0;font-size:15px;font-weight:600}
h2::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;background:var(--c)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg label{position:relative}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:block;padding:7px 14px;font-size:15px;font-weight:500}
.seg label+label span{border-left:1.5px solid var(--ink)}
.seg input:checked+span{background:var(--ink);color:var(--paper)}
.seg input:focus-visible+span{outline:3px solid var(--pt);outline-offset:-3px}
.rn{display:flex;align-items:center;gap:12px;margin-top:6px}
input[type=range]{flex:1;height:32px;accent-color:var(--ink)}
.num{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.num input{width:62px;font:inherit;font-size:16px;text-align:right;padding:6px 8px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
.actions{position:sticky;bottom:0;z-index:5;margin-top:auto;display:flex;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--desk)}
button{font:inherit;font-weight:600;min-height:48px;border-radius:8px;border:1.5px solid var(--ink);cursor:pointer}
.go{flex:1;background:var(--ink);color:var(--paper)}
.ghost{background:transparent;color:var(--ink);padding:0 20px}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--pt);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Projection of a point</h1>
    <p>Place point A in space, then project it.</p>
  </header>

  <section class="stage">
    <div class="sheet">
      <canvas id="cv" role="img" aria-label="Point A between the vertical and horizontal planes"></canvas>
      <div class="tb"><b id="step">Ready</b><p id="cap" aria-live="polite"></p></div>
    </div>
  </section>

  <section class="controls">
    <div class="group" style="--c:var(--vp)">
      <div class="row"><h2>Distance from VP</h2>
        <div class="seg">
          <label><input type="radio" name="vp" value="front" checked><span>In front</span></label>
          <label><input type="radio" name="vp" value="behind"><span>Behind</span></label>
        </div></div>
      <div class="rn"><input type="range" id="dyR" min="0" max="70" value="30" aria-label="Distance from VP">
        <label class="num"><input type="number" id="dyN" inputmode="numeric" min="0" max="70" value="30">mm</label></div>
    </div>
    <div class="group" style="--c:var(--hp)">
      <div class="row"><h2>Distance from HP</h2>
        <div class="seg">
          <label><input type="radio" name="hp" value="above" checked><span>Above</span></label>
          <label><input type="radio" name="hp" value="below"><span>Below</span></label>
        </div></div>
      <div class="rn"><input type="range" id="dzR" min="0" max="70" value="40" aria-label="Distance from HP">
        <label class="num"><input type="number" id="dzN" inputmode="numeric" min="0" max="70" value="40">mm</label></div>
    </div>
  </section>

  <div class="actions">
    <button class="go" id="go">Project</button>
    <button class="ghost" id="reset">Reset</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const W=90,H=80,D=80,X0=20,DEG=Math.PI/180;
const INK='#1E2327',PAPER='#F6F8F7',VPC='#2C5E8F',HPC='#2F8363',PT='#D2402F';
const FONT="'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif";
const ORD=['1st','2nd','3rd','4th'];

// timeline (seconds)
const K={p1:[0,1.6],p2:[1.6,3.2],p3:[3.2,4.8],fade:[4.8,5.8],rot:[5.8,11.3],swing:[11.3,13]},END=13;
const S={front:true,above:true,dy:30,dz:40};

// Updated camera angle to match reference image (XY line goes bottom-left to top-right)
const cam={yaw:-35*DEG,pitch:22*DEG};
let C=cam,T=0,playing=false,last=0,raf=0,cw=0,ch=0;
let baseScale=1, zoom=1, panX=0, panY=0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,r)=>clamp((t-r[0])/(r[1]-r[0]),0,1);
const ease=u=>.5-.5*Math.cos(Math.PI*u);
const lerp3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const mid=(a,b)=>lerp3(a,b,.5);

const cv=$('cv'),ctx=cv.getContext('2d');
function resize(){
  const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,3);
  cw=r.width;ch=r.height;cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  baseScale=Math.min(cw/2/136,ch/2/112);
  schedule();
}
new ResizeObserver(resize).observe(cv);
if(document.fonts)document.fonts.ready.then(()=>schedule());

// Modified projection function to include dynamic zoom & pan
function pr(p){
  const sy=Math.sin(C.yaw),cy=Math.cos(C.yaw),sp=Math.sin(C.pitch),cp=Math.cos(C.pitch);
  return [
    cw/2 + (p[0]*cy - p[1]*sy)*baseScale*zoom + panX, 
    ch/2 - (-p[0]*sy*sp - p[1]*cy*sp + p[2]*cp)*baseScale*zoom + panY
  ];
}
function poly(pts,fill,stroke,lw){
  ctx.beginPath();pts.forEach((p,i)=>{const q=pr(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();
}
function line(a,b,col,lw,dash,al){
  const p=pr(a),q=pr(b);
  ctx.save();ctx.globalAlpha=al??1;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash(dash||[]);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();ctx.restore();
}
function dot(p3,r,col,al){
  const p=pr(p3);ctx.save();ctx.globalAlpha=al??1;
  ctx.beginPath();ctx.arc(p[0],p[1],r+2,0,7);ctx.fillStyle=PAPER;ctx.fill();
  ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fillStyle=col;ctx.fill();ctx.restore();
}
function text(txt,p3,dx,dy,o){
  const p=pr(p3);o=o||{};
  ctx.save();ctx.globalAlpha=o.al??1;
  ctx.font=`${o.it===false?'':'italic '}${o.w||600} ${o.size||15}px ${FONT}`;
  ctx.textAlign=o.align||'left';ctx.textBaseline=o.base||'alphabetic';
  ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle=PAPER;ctx.strokeText(txt,p[0]+dx,p[1]+dy);
  ctx.fillStyle=o.col||INK;ctx.fillText(txt,p[0]+dx,p[1]+dy);ctx.restore();
}

function draw(){
  const t=T,pre=t===0;
  const p1=seg(t,K.p1),p2=seg(t,K.p2),p3=seg(t,K.p3),fade=1-seg(t,K.fade);
  const th=ease(seg(t,K.rot))*Math.PI/2,sw=ease(seg(t,K.swing));
  C={yaw:cam.yaw*(1-sw),pitch:cam.pitch*(1-sw)};
  
  // Dynamic Zoom and Pan Logic
  let z_phase = 0;
  if(t > 0 && t < K.swing[0]){
    z_phase = t < 1.0 ? ease(t/1.0) : 1; // Smoothly zoom in over first 1 second
  } else if(t >= K.swing[0]){
    z_phase = 1 - ease(seg(t, K.swing)); // Smoothly zoom out as we swing to 2D view
  }
  
  zoom = 1 + 0.6 * z_phase; // Increases scale by 60% when fully zoomed
  
  const x=X0,y=S.front?S.dy:-S.dy,z=S.above?S.dz:-S.dz;
  
  // Calculate focal point to pan towards (center of the active quadrant)
  const fx = x;
  const fy = S.front ? Math.max(10, S.dy/2) : Math.min(-10, -S.dy/2);
  const fz = S.above ? Math.max(10, S.dz/2) : Math.min(-10, -S.dz/2);
  
  const sy_cam=Math.sin(C.yaw),cy_cam=Math.cos(C.yaw),sp_cam=Math.sin(C.pitch),cp_cam=Math.cos(C.pitch);
  const sfx = (fx*cy_cam - fy*sy_cam) * baseScale * zoom;
  const sfy = -(-fx*sy_cam*sp_cam - fy*cy_cam*sp_cam + fz*cp_cam) * baseScale * zoom;
  
  panX = -sfx * z_phase;
  panY = -sfy * z_phase; // Offsets the screen so the focal point is centered

  const cs=Math.cos(th),sn=Math.sin(th);
  const hp=(px,py)=>[px,py*cs,-py*sn];
  const P=[x,y,z],FV=[x,0,z],TV0=[x,y,0],TV=hp(x,y),AX=[x,0,0];
  const fk=1-.35*sw;

  ctx.fillStyle=PAPER;ctx.fillRect(0,0,cw,ch);
  ctx.strokeStyle='rgba(30,35,39,.6)';ctx.lineWidth=1;ctx.strokeRect(6.5,6.5,cw-13,ch-13);

  // planes
  poly([[-W,0,-H],[W,0,-H],[W,0,H],[-W,0,H]],`rgba(44,94,143,${.14*fk})`,VPC,1.4);
  poly([[-W,-D,0],[W,-D,0],[W,D,0],[-W,D,0]].map(q=>hp(q[0],q[1])),`rgba(47,131,99,${.16*fk})`,HPC,1.4);

  // quadrant labels
  const qa=1-seg(t,[K.rot[0]-.3,K.rot[0]+.5]);
  if(qa>0){
    const act=(S.dy&&S.dz)?(S.front&&S.above?0:!S.front&&S.above?1:!S.front?2:3):-1;
    [['I',1,1],['II',-1,1],['III',-1,-1],['IV',1,-1]].forEach((q,i)=>{
      const p=pr([-W+20,q[1]*46,q[2]*46]);
      ctx.save();ctx.globalAlpha=qa*(i===act?1:.6);
      ctx.beginPath();ctx.arc(p[0],p[1],12,0,7);
      if(i===act){ctx.fillStyle=PT;ctx.fill()}else{ctx.strokeStyle=INK;ctx.lineWidth=1;ctx.stroke()}
      ctx.fillStyle=i===act?'#fff':INK;ctx.font=`600 12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(q[0],p[0],p[1]+.5);ctx.restore();
    });
  }

  // reference line + tags
  line([-W-12,0,0],[W+12,0,0],INK,2.4);
  text('X',[-W-14,0,0],0,5,{align:'center',size:16});
  text('Y',[W+14,0,0],0,5,{align:'center',size:16});
  text('VP',[W-8,0,H-10],0,0,{align:'right',col:VPC,size:13,it:false});
  text('HP',hp(W-8,D-12),0,0,{align:'right',col:HPC,size:13,it:false});

  // views' distances from XY
  if(p3>0){
    if(S.dz)line(AX,lerp3(AX,FV,p3),INK,1.6);
    if(S.dy)line(AX,lerp3(AX,TV,p3),INK,1.6);
    dot(AX,2.5,INK);
    text('x',AX,8,16,{size:14,al:seg(p3,[.2,.6])});
    const da=seg(p3,[.6,1]);
    if(S.dz)text(S.dz+' mm',mid(AX,FV),-8,5,{align:'right',size:12.5,w:500,it:false,al:da});
    if(S.dy)text(S.dy+' mm',mid(AX,TV),-8,5,{align:'right',size:12.5,w:500,it:false,al:da});
  }

  // path of the top view while the HP turns
  if(th>.01&&S.dy){
    ctx.save();ctx.strokeStyle=HPC;ctx.lineWidth=1.4;ctx.setLineDash([4,4]);ctx.beginPath();
    const n=Math.ceil(th/(Math.PI/2)*48)+2;
    for(let i=0;i<=n;i++){const a=th*i/n,q=pr([x,y*Math.cos(a),-y*Math.sin(a)]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}
    ctx.stroke();ctx.restore();
    if(th>.3){ 
      const a=th*.55,q=[x,y*Math.cos(a),-y*Math.sin(a)],g=[0,-y*Math.sin(a)*.05,-y*Math.cos(a)*.05];
      const s0=pr(q),s1=pr([q[0],q[1]+g[1],q[2]+g[2]]);
      let dx=s1[0]-s0[0],dy=s1[1]-s0[1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
      ctx.fillStyle=HPC;ctx.beginPath();
      ctx.moveTo(s0[0]+dx*6,s0[1]+dy*6);ctx.lineTo(s0[0]-dx*5-dy*4,s0[1]-dy*5+dx*4);ctx.lineTo(s0[0]-dx*5+dy*4,s0[1]-dy*5-dx*4);ctx.fill();
    }
  }

  // projectors from A
  if(pre){
    if(S.dy)line(P,FV,PT,1.2,[5,4],.35);
    if(S.dz)line(P,TV0,PT,1.2,[5,4],.35);
  }else if(fade>0){
    if(S.dy&&p1>0)line(P,lerp3(P,FV,p1),PT,1.5,[5,4],fade);
    if(S.dz&&p2>0)line(P,lerp3(P,TV0,p2),PT,1.5,[5,4],fade);
    if(S.dy&&p1>.5)text(S.dy+' mm',mid(P,FV),-7,-5,{align:'right',col:PT,size:12.5,w:500,it:false,al:fade*seg(p1,[.5,.9])});
    if(S.dz&&p2>.5)text(S.dz+' mm',mid(P,TV0),-7,-5,{align:'right',col:PT,size:12.5,w:500,it:false,al:fade*seg(p2,[.5,.9])});
  }

  // front view a' and top view a
  if(!pre){
    const fa=seg(t,[K.p1[1]-.25,K.p1[1]]),ta=seg(t,[K.p2[1]-.25,K.p2[1]]);
    if(fa>0){dot(FV,4,INK,fa);text('a′',FV,10,-8,{al:fa})}
    if(ta>0){dot(TV,4,INK,ta);text('a',TV,10,16,{al:ta})}
  }
  const pa=pre?1:fade;
  if(pa>0){dot(P,5.5,PT,pa);text('A',P,-10,-9,{align:'right',col:PT,size:16,al:pa})}
}

// captions
function quad(){
  if(!S.dy&&!S.dz)return 'xy';if(!S.dy)return 'vp';if(!S.dz)return 'hp';
  return S.front&&S.above?1:!S.front&&S.above?2:!S.front?3:4;
}
function captions(){
  const {front,above,dy,dz}=S,q=quad();
  const vpT=dy?`${dy} mm ${front?'in front of':'behind'} the VP`:'in the VP';
  const hpT=dz?`${dz} mm ${above?'above':'below'} the HP`:'in the HP';
  const tail=typeof q==='number'?ORD[q-1]+' quadrant':q==='vp'?(above?'edge of the 1st and 2nd quadrants':'edge of the 3rd and 4th quadrants'):(front?'edge of the 1st and 4th quadrants':'edge of the 2nd and 3rd quadrants');
  const aF=dz?`a′ is ${dz} mm ${above?'above':'below'} XY`:'a′ lies on XY';
  const aT=dy?`a is ${dy} mm ${front?'below':'above'} XY`:'a lies on XY';
  return [
    q==='xy'?'A lies on the XY line, where the VP meets the HP.':`A is ${vpT} and ${hpT}: ${tail}.`,
    'Project A on the VP. The projector meets the VP at the front view a′.',
    'Project A on the HP. The projector meets the HP at the top view a.',
    `${dz?`a′ is ${dz} mm${above?'above':'below'} XY on the VP`:'a′ lies on XY'}. ${dy?`a is ${dy} mm${front?'in front of':'behind'} XY on the HP`:'a lies on XY'}.`,
    'Rotate the HP 90° clockwise about XY. Its front half swings down, the rear half swings up.',
    'View the VP face-on. Both planes now lie flat, with XY level.',
    `${typeof q==='number'?ORD[q-1]+' quadrant':'Result'}: ${aF}, ${aT}, both on one projector perpendicular to XY.`
  ];
}
let lastCap='';
function ui(){
  const i=T===0?-1:T<K.p1[1]?0:T<K.p2[1]?1:T<K.p3[1]?2:T<K.swing[0]?3:T<END?4:5;
  const c=captions(),txt=c[i<0?0:i===0?1:i===1?2:i===2?3:i===3?4:i===4?5:6];
  if(txt!==lastCap){lastCap=txt;$('cap').textContent=txt;cv.setAttribute('aria-label',txt)}$('step').textContent=i<0?'Ready':i===5?'Done':`Step ${i+1} of 5`;
}

function tick(ts){
  raf=0;
  if(playing){
    T=Math.min(END,T+clamp((ts-last)/1000,0,.1));last=ts;
    if(T>=END){playing=false;buttons()}
  }
  draw();ui();
  if(playing)schedule();
}
function schedule(){if(!raf)raf=requestAnimationFrame(tick)}
function buttons(){
  const go=$('go');go.disabled=playing;
  go.textContent=playing?'Projecting…':T>=END?'Replay':'Project';
}
function restart(){playing=false;T=0;buttons();schedule()}

$('go').onclick=()=>{if(playing)return;T=0;playing=true;last=performance.now();buttons();schedule()};$('reset').onclick=restart;

// inputs
function link(r,n,key){
  const set=v=>{v=clamp(Math.round(v),0,70);S[key]=v;r.value=v;return v};
  r.oninput=()=>{n.value=set(+r.value);restart()};
  n.oninput=()=>{if(n.value===''||isNaN(+n.value))return;set(+n.value);restart()};
  n.onchange=()=>{n.value=set(+n.value||0);restart()};
}
link($('dyR'),$('dyN'),'dy');link($('dzR'),$('dzN'),'dz');
document.querySelectorAll('input[name=vp]').forEach(i=>i.onchange=()=>{S.front=document.querySelector('input[name=vp]:checked').value==='front';restart()});
document.querySelectorAll('input[name=hp]').forEach(i=>i.onchange=()=>{S.above=document.querySelector('input[name=hp]:checked').value==='above';restart()});

buttons();schedule();
})();
</script>
</body>
</html>
